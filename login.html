<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arma Reforger — Panel Login</title>
  <script src="/static/theme.js?v=themes-8"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c8a84b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arma Panel">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
      <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/themes.css?v=themes-8">
  <link rel="stylesheet" href="/static/login.css">
<link rel="stylesheet" href="/static/panel.css?v=original-boxy-1">
</head>
<body class="login-page" data-login-page>
  <main class="login-box" aria-labelledby="login-title">
    <div class="login-corner" aria-hidden="true"></div>
    <p class="login-tag">&#9632; Server Management Panel</p>
    <h1 id="login-title">ARMA <span>REFORGER</span></h1>
    <form id="login-form" method="post" action="/login" aria-describedby="login-error">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" placeholder="admin" required autofocus>
      </div>
      <div class="field">
        <label for="pwd">Password</label>
        <input id="pwd" name="password" type="password" autocomplete="current-password" placeholder="Enter password…" required>
      </div>
      <button class="login-submit" type="submit">Sign in</button>
      <p class="login-error" id="login-error" role="alert" hidden></p>
    </form>
    <noscript>Enable JavaScript to sign in to the panel.</noscript>
  </main>
  <script src="/static/login.js"></script>
  <script src="/static/pwa.js"></script>
</body>
</html>
